<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALETSE FIT</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ALETSE FIT">
<meta name="theme-color" content="#070707">
<link rel="apple-touch-icon" href="icon-180.png">
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* VOICE: elegante y serena, como un estudio de entrenamiento boutique
   IDEA: una agenda personal de bienestar, una página por pestaña
   PICTURE: la tarjeta de frase motivadora y el anillo de logros del día, ambos tocables
   COLOUR and TYPE: tinta casi negra, blanco puro, azul real de marca y coral mariposa; DM Serif Display + Inter
   LAYOUT: una columna amplia, pestañas fijas abajo: Inicio, Entreno, Nutrición, Logros, Perfil */
:root{color-scheme:dark;
--bg:light-dark(#faf8f3,#070707);--ink:light-dark(#15130e,#f3eee2);--mute:light-dark(#6e675a,#a8a090);
--brand:light-dark(#a8801f,#d4af37);--on:#0b0b0b;--deep:light-dark(#15130e,#000000);--accent:light-dark(#a8801f,#e9c766);
--soft:light-dark(#f1ebdc,#17150f);--line:light-dark(#e4dccb,#2b261b);--card:light-dark(#ffffff,#111111);--gold:light-dark(#a8801f,#d4af37);
--goldg:linear-gradient(135deg,#f6e3a1,#d4af37 50%,#9c7820)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.08;text-wrap:balance;font-weight:400}
h1{font:400 36px/1.05 'DM Serif Display',Georgia,serif}h2{font:400 24px/1.1 'DM Serif Display',Georgia,serif}h3{font:600 16px/1.3 Inter,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top)) 22px 8px}
.logo{display:flex;align-items:center;gap:10px;font:900 17px Cinzel,serif;letter-spacing:.08em;color:var(--gold)}
.logo svg{width:34px;height:34px}
main{padding:8px 22px 28px}
.eyebrow{font-size:14px;color:var(--mute);margin:0 0 6px}
.section{margin-top:28px}.section>h2{margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1}
.list{display:grid;gap:10px}.mute{color:var(--mute);font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:16px;border:0;font-weight:600}
.btn.primary{background:var(--goldg);color:var(--on)}.btn.dark{background:var(--deep);color:#f3eee2;border:1px solid var(--gold)}
.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.block{width:100%}
.btn.light{background:#0b0b0b;color:#f6e3a1}
/* Frase */
.quote{position:relative;overflow:hidden;background:var(--deep);color:#f3eee2;border:1px solid var(--gold) !important;border-radius:28px;padding:28px 24px 22px;min-height:250px;display:flex;flex-direction:column;width:100%;text-align:left;border:0}
.quote .q{font:400 clamp(26px,7vw,34px)/1.15 'DM Serif Display',Georgia,serif;margin:14px 0 18px;flex:1;text-wrap:balance}
.quote .lbl{font-size:13px;opacity:.7}.quote .tap{display:flex;align-items:center;gap:8px;font-size:14px;opacity:.85}
.quote svg.w{position:absolute;right:-30px;top:-26px;width:170px;opacity:.14}
.quote .q.fade{animation:fd .45s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
/* Resumen */
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;width:100%}
.tile b{display:block;font:400 28px 'DM Serif Display',serif;margin-top:4px}
.tile span{font-size:13px;color:var(--mute)}
/* Entreno */
.hero{background:var(--goldg);color:var(--on);border-radius:26px;padding:24px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(30px,8vw,40px);margin:8px 0 10px;color:var(--on)}
.hero .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;opacity:.9}
.hero svg.w{position:absolute;right:-20px;bottom:-26px;width:150px;opacity:.18}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 2px;text-align:center;min-height:66px}
.day b{display:block;font-size:12px;color:var(--mute);font-weight:500}
.day span{display:block;font:400 19px 'DM Serif Display',serif;margin-top:2px}
.day.sel{background:var(--goldg);border-color:var(--gold);color:var(--on)}.day.sel b{color:var(--on);opacity:.7}
.day.done span::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.wk{display:flex;align-items:center;gap:14px;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card);width:100%;text-align:left}
.wk .badge{flex:none;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font:400 17px 'DM Serif Display',serif;color:var(--brand)}
.ex{padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.ex .sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.set{min-width:48px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:600;padding:0 10px}
.set.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.seg{display:grid;grid-template-columns:repeat(2,1fr);background:var(--soft);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;min-height:42px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(16,19,34,.12)}
/* Nutrición */
.meal{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--card)}
.meal .tag{font-size:13px;color:var(--brand);font-weight:600}.meal p{margin:2px 0 0}
.check{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;margin-top:2px}
.check.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
.water{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.glass{height:46px;border-radius:8px 8px 13px 13px;border:1.5px solid var(--brand);background:transparent}
.glass.on{background:var(--brand)}
/* Logros */
.ringwrap{display:flex;align-items:center;gap:20px}
.ring{flex:none;width:132px;height:132px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 34px 'DM Serif Display',serif}
.ach{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.ach .ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--mute)}
.ach.ok .ic{background:var(--brand);color:var(--on)}
.medals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.medal{text-align:center;padding:14px 8px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.medal .m{width:52px;height:52px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;border:2px dashed var(--line);color:var(--mute);font:400 18px 'DM Serif Display',serif}
.medal.ok .m{border:0;background:var(--goldg);color:var(--on)}
.medal span{font-size:13px;display:block;line-height:1.3}
.medal.no span{color:var(--mute)}
/* Perfil y login */
.goal{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);width:100%;text-align:left}
.goal.on{border-color:var(--brand);background:var(--soft)}
.goal .gi{flex:none;width:44px;height:44px;border-radius:50%;background:var(--goldg);color:var(--on);display:grid;place-items:center;font:400 16px 'DM Serif Display',serif}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 18px;border-radius:22px;border:1.5px solid var(--line);background:var(--card);font-weight:500}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--on)}
label{display:block;font-size:14px;font-weight:500;margin:14px 0 6px}
input{font:16px Inter,sans-serif;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:0 16px;width:100%}
.auth{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:calc(24px + env(safe-area-inset-top)) 24px 32px;max-width:460px;margin:0 auto}
.authbg{background:radial-gradient(circle at 50% 18%,#3a2e12,transparent 55%),linear-gradient(135deg,transparent 48%,rgba(212,175,55,.14) 49%,transparent 50%),var(--bg)}
.auth .brand{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:26px}
.auth .brand svg{width:132px;height:132px;filter:drop-shadow(0 10px 30px rgba(212,175,55,.25))}
.wm{font:900 44px/1 Cinzel,serif;letter-spacing:.06em;background:linear-gradient(180deg,#f6e3a1,#d4af37 55%,#8c6a1a);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:16px}
.wm2{display:flex;align-items:center;gap:12px;font:700 18px Cinzel,serif;letter-spacing:.45em;color:var(--gold);margin-top:6px}.wm2 i{width:34px;height:1px;background:var(--gold)}
.tagline{font-size:11px;letter-spacing:.28em;color:var(--gold);margin-top:10px;font-weight:600}
.slogan{font-size:12px;letter-spacing:.3em;color:var(--mute);margin-top:12px}
.err{color:var(--accent);font-size:14px;margin:10px 0 0;min-height:20px}
.link{background:none;border:0;color:var(--brand);font-weight:600;min-height:44px;padding:0}
.promo{display:flex;gap:14px;align-items:center;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.promo .mk{flex:none;width:48px;height:48px;border-radius:14px;background:var(--goldg);display:grid;place-items:center}
.promo .mk svg{width:48px}
.fig{position:relative;height:190px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.note{font-size:13px;color:var(--mute);margin-top:18px}
.empty{padding:20px;text-align:center;color:var(--mute);border:1.5px dashed var(--line);border-radius:18px;font-size:15px}
.back{background:none;border:0;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0;color:var(--brand);font-weight:600}
.timer{border:1px solid var(--gold);position:fixed;left:50%;transform:translateX(-50%);bottom:calc(98px + env(safe-area-inset-bottom));width:min(516px,calc(100% - 44px));background:var(--deep);color:#fff;border-radius:20px;padding:12px 16px;display:none;align-items:center;gap:12px;z-index:9;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.timer.show{display:flex}.timer b{font:400 28px 'DM Serif Display',serif;min-width:62px}
.timer .bar{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden}.timer .bar i{display:block;height:100%;background:var(--gold)}
.timer button{background:transparent;border:1px solid rgba(255,255,255,.5);border-radius:12px;min-height:40px;padding:0 12px;color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:8}
nav.tabs div{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
nav.tabs button{background:none;border:0;min-height:66px;display:grid;place-items:center;gap:3px;font-size:11px;color:var(--mute);padding:8px 0}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button.on{color:var(--ink);font-weight:600}
nav.tabs button.on svg{color:var(--brand)}
/* Productos */
.pshow{position:relative;overflow:hidden;border-radius:28px;border:1px solid var(--gold);background:radial-gradient(circle at 50% 30%,#3a2e12,#050505 70%);color:#f3eee2;padding:26px 22px 22px;text-align:center}
.pshow svg.jar{width:min(220px,60%);height:auto;display:block;margin:0 auto 10px;filter:drop-shadow(0 18px 30px rgba(212,175,55,.25))}
.pshow .badge2{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;padding:5px 12px;border-radius:12px;background:var(--goldg);color:var(--on)}
.pshow h1{color:#f6e3a1;margin:12px 0 6px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.feat div{padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.feat b{display:block;font-size:15px}.feat span{font-size:13px;color:var(--mute)}
.soon{display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.soon .mini{flex:none;width:48px;height:48px;border-radius:14px;background:var(--soft);display:grid;place-items:center}
/* Racha, avatar, fondo, privado */
.hdr-r{display:flex;align-items:center;gap:10px}
.streak{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px}
.streak svg{width:16px;height:16px;color:var(--accent)}
.av{width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--goldg);color:var(--on);display:grid;place-items:center;font:400 17px 'DM Serif Display',serif;border:0;padding:0;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.big{width:96px;height:96px;font-size:38px}
.photo-row{display:flex;align-items:center;gap:18px}
.filebtn{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:15px}
.swatches{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.sw{aspect-ratio:1;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{outline:3px solid var(--brand);outline-offset:2px}
.colorpick{display:flex;align-items:center;gap:12px;margin-top:14px}
.colorpick input{width:56px;height:44px;padding:2px;border-radius:12px;min-height:0}
.streakcard{display:flex;align-items:center;gap:16px;background:var(--goldg);color:var(--on);border-radius:22px;padding:18px}
.streakcard b{font:400 40px/1 'DM Serif Display',serif}
.streakcard svg{width:44px;height:44px;flex:none}
.prem{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 0%,#3a2e12,#050505 70%);color:#f3eee2;border-radius:26px;padding:24px;border:1px solid #d4af37;width:100%;text-align:left}
.prem .price{font:400 34px 'DM Serif Display',serif}.prem small{opacity:.75}
.prem svg.w{position:absolute;right:-30px;top:-26px;width:150px;opacity:.16}
.prem .gold{color:#d4af37;font-size:13px;font-weight:600;letter-spacing:.04em}
.ben{display:flex;gap:14px;align-items:flex-start;padding:16px;border-radius:20px;border:1px solid var(--line);background:var(--card)}
.ben .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--goldg);color:var(--on);display:grid;place-items:center;font:400 18px 'DM Serif Display',serif}
.status{display:inline-block;font-size:13px;font-weight:600;padding:4px 10px;border-radius:10px;background:var(--soft);color:var(--brand);margin-top:6px}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px}
.msg.me{align-self:flex-end;background:var(--brand);color:var(--on);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.msg time{display:block;font-size:12px;opacity:.7;margin-top:2px}
textarea{font:16px Inter,sans-serif;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:12px 16px;width:100%;min-height:90px;resize:vertical}
.modal{position:fixed;inset:0;background:rgba(10,12,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal.show{display:flex}
.sheet{background:var(--card);color:var(--ink);border-radius:26px;padding:24px;width:min(520px,100%);margin-bottom:env(safe-area-inset-bottom)}
.toast{border:1px solid var(--gold);position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--deep);color:#fff;padding:12px 18px;border-radius:16px;font-weight:600;z-index:30;display:none;align-items:center;gap:8px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{display:flex}.toast svg{width:18px;height:18px;color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.toast.show{animation:fd .4s ease-out}}
@media (prefers-reduced-motion:no-preference){.screen{animation:in .3s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
@media (prefers-reduced-motion:reduce){.quote .q.fade{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="timer" id="timer" role="status"><b id="tNum">60</b><div class="bar"><i id="tBar"></i></div><button id="tSkip">Saltar</button></div>
<nav class="tabs" id="tabs" style="display:none"><div>
  <button data-t="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-t="entreno"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 7v10M18 7v10M3 9v6M21 9v6M6 12h12"/></svg>Entreno</button>
  <button data-t="nutricion"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 7c-2-3-7-3-8 1s2 12 5 12c1 0 2-1 3-1s2 1 3 1c3 0 6-8 5-12s-6-4-8-1z"/><path d="M12 7c0-2 1-4 3-4"/></svg>Nutrición</button>
  <button data-t="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>Productos</button>
  <button data-t="logros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="9" r="6"/><path d="M8.5 14l-1.5 7 5-3 5 3-1.5-7"/></svg>Logros</button>
  <button data-t="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Perfil</button>
</div></nav>

<script src="config.js"></script>
<script src="js/fb.js" onerror="void 0"></script>
<script src="js/backend.js"></script>
<script>
{
const WING='<path d="M20 21c-3-7-10-9-12-6s1 8 6 8c-4 1-5 5-3 6s6-1 9-8zm0 0c3-7 10-9 12-6s-1 8-6 8c4 1 5 5 3 6s-6-1-9-8z"/>';
const EMB=`<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6e3a1"/><stop offset=".45" stop-color="#d4af37"/><stop offset="1" stop-color="#8c6a1a"/></linearGradient>
<linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8c766"/><stop offset="1" stop-color="#a7801f"/></linearGradient>
</defs>
<circle cx="100" cy="100" r="96" fill="#0b0b0b" stroke="url(#g1)" stroke-width="4"/>
<circle cx="100" cy="100" r="86" fill="none" stroke="#d4af37" stroke-opacity=".35" stroke-width="1"/>
<!-- cabeza -->
<polygon points="100,24 126,36 146,56 156,84 160,110 152,138 136,156 116,166 100,168 84,166 64,156 48,138 40,110 44,84 54,56 74,36" fill="url(#g1)"/>
<!-- facetas -->
<polygon points="100,24 126,36 146,56 100,62 54,56 74,36" fill="#f3dc8c"/>
<polygon points="54,56 100,62 146,56 156,84 100,80 44,84" fill="#d9b548"/>
<!-- frente / ceja -->
<polygon points="42,88 100,80 158,88 150,104 114,98 100,108 86,98 50,104" fill="#0b0b0b"/>

function drawChart(){const s=document.getElementById('chart');if(!s)return;
  const draw=()=>{const Wd=s.clientWidth,H=s.clientHeight,p=28;const v=S.weights.map(w=>+w.kg);const mn=Math.min(...v)-1,mx=Math.max(...v)+1;
    const x=i=>p+i*(Wd-2*p)/Math.max(1,v.length-1);const y=k=>H-p-(k-mn)/(mx-mn)*(H-2*p);
    s.innerHTML=`<polyline points="${v.map((k,i)=>x(i)+','+y(k)).join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>`+v.map((k,i)=>`<circle cx="${x(i)}" cy="${y(k)}" r="4" fill="var(--accent)"/>`).join('')+`<text x="${p}" y="18" font-size="13" fill="var(--mute)">${mx-1} kg</text><text x="${p}" y="${H-8}" font-size="13" fill="var(--mute)">${mn+1} kg</text>`};
  const ro=new ResizeObserver(draw);ro.observe(s)}

function resizePhoto(file){return new Promise((ok,ko)=>{const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const s=256,c=document.createElement('canvas');c.width=c.height=s;const x=c.getContext('2d');const m=Math.min(img.width,img.height);
    x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s);URL.revokeObjectURL(url);ok(c.toDataURL('image/jpeg',.85))};
  img.onerror=()=>{URL.revokeObjectURL(url);ko()};img.src=url})}

  if(d.a==='edit'){draft=Object.assign({},S.profile);sub='setup';render();return}
  if(d.a==='close'){sub=null;stopRest();render();return}
  if(d.a==='logout'){closeModal();tab='inicio';sub=null;authMode='login';AB.signOut();return}
  if(d.go){tab=d.go;sub=null;stopRest();if(d.nv)nutView=d.nv;render();return}
  if(d.goSub){sub=d.goSub;render();return}
  if(d.pt){privTab=d.pt;render();return}
  if(d.bg){S.bg=d.bg;save();render();return}
  if(d.a==='delphoto'){U.photo=null;AB.saveProfile({photo:null});render();return}
  if(d.a==='subscribe'&&AB.mode!=='local'){doBuy();return}
  if(d.a==='restore'){doRestore();return}
  if(d.a==='forgot'){forgot();return}
  if(d.a==='delacc'){delAcc();return}
  if(d.a==='subscribe'){openModal(`<span class="gold" style="color:var(--gold);font-weight:600;font-size:13px">ALETSE FIT VIP</span><h2 style="margin:8px 0 10px">Confirmar suscripción</h2>
    <p style="margin:0 0 6px">9,99 € al mes. Incluye plan privado de entreno, plan privado de dieta y consultoría.</p>
    <p class="mute" style="margin:0 0 18px">Modo prueba: no se cobrará nada. En la app de las tiendas aquí aparecerá el pago de Google Play o App Store.</p>
    <button class="btn primary block" data-m="sub">Confirmar 9,99 €/mes</button><button class="btn ghost block" data-m="no" style="margin-top:10px">Ahora no</button>`);return}
  if(d.a==='unsub'){openModal(`<h2 style="margin-bottom:10px">¿Cancelar ALETSE FIT VIP?</h2><p class="mute" style="margin:0 0 18px">Perderás el acceso a tus planes privados y a la consultoría.</p>
    <button class="btn dark block" data-m="unsub">Sí, cancelar</button><button class="btn ghost block" data-m="no" style="margin-top:10px">Mantener suscripción</button>`);return}
  if(d.nv2){nutView=d.nv2;render();return}
  if(d.open){prog={};sub=d.open;render();return}
  if(d.set){prog[d.set]=!prog[d.set];t.classList.toggle('on',prog[d.set]);if(prog[d.set])startRest(+d.rest);return}
  if(d.finish){S.done[TK]=d.finish;save();stopRest();sub=null;tab='logros';render();return}
  if(d.water){const n=+d.water;S.water[TK]=S.water[TK]===n?n-1:n;save();render();return}
  if(d.meal){const a=S.meals[TK]||[false,false,false,false,false];a[+d.meal]=!a[+d.meal];S.meals[TK]=a;save();render();return}
  if(d.day){selDay=+d.day;render();return}if(d.dday){dietDay=+d.dday;render();return}
  if(d.delw){S.weights.splice(+d.delw,1);save();render();return}
});
root.addEventListener('submit',async e=>{e.preventDefault();
  if(e.target.id==='wForm'){const v=parseFloat(document.getElementById('wIn').value);if(!(v>=25&&v<=300))return;
    S.weights=S.weights.filter(w=>w.d!==TK);S.weights.push({d:TK,kg:Math.round(v*10)/10});S.weights.sort((a,b)=>a.d<b.d?-1:1);save();render();return}
  if(e.target.id==='qForm'){const g=id=>document.getElementById(id).value.trim();
    const f={age:g('qAge'),h:g('qH'),w:g('qW'),days:g('qDays'),inj:g('qInj'),food:g('qFood'),goal:g('qGoal')};
    if(!f.age||!f.h||!f.w||!f.days){document.getElementById('qErr').textContent='Rellena edad, altura, peso y días.';return}
    if(!document.getElementById('qOk').checked){document.getElementById('qErr').textContent='Necesitamos tu consentimiento para preparar tus planes.';return}
    f.consentAt=Date.now();
    AB.vip.saveForm(f).then(()=>toast('Cuestionario enviado')).catch(()=>toast('No se pudo enviar. Revisa tu conexión.'));return}
  if(e.target.id==='cForm'){const v=document.getElementById('cIn').value.trim();if(!v)return;
    document.getElementById('cIn').value='';AB.vip.send(v).catch(()=>toast('No se pudo enviar. Revisa tu conexión.'));return}
  if(e.target.id!=='authForm')return;
  const mail=document.getElementById('aMail').value.trim().toLowerCase();const pass=document.getElementById('aPass').value;const nm=document.getElementById('aName');
  const fail=m=>{authErr=m;document.getElementById('aErr').textContent=m};
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail))return fail('Escribe un correo válido.');
  if(pass.length<6)return fail('La contraseña necesita al menos 6 caracteres.');
  if(authMode==='reg'&&!nm.value.trim())return fail('Escribe tu nombre.');
  const btn=document.getElementById('aBtn');btn.disabled=true;btn.textContent='Un momento…';
  try{if(authMode==='reg')await AB.signUp(nm.value.trim(),mail,pass);else await AB.signIn(mail,pass);authErr='';tab='inicio';sub=null}
  catch(x){btn.disabled=false;btn.textContent=authMode==='reg'?'Crear cuenta':'Iniciar sesión';fail(x.userMessage||'Algo ha fallado.')}});

async function syncVip(){if(AB.mode!=='cloud'||!AB.pay.native||!U)return;const a=await AB.pay.isActive();if(a===true)AB.vip.activate(U).catch(()=>{});else if(a===false&&S&&S.premium)AB.vip.deactivate().catch(()=>{})}
async function doBuy(){if(!AB.pay.native){openModal(`<h2 style="margin-bottom:10px">Suscríbete desde la app</h2><p class="mute" style="margin:0 0 18px">La suscripción VIP se contrata desde la app ALETSE FIT de Google Play o App Store.</p><button class="btn primary block" data-m="no">Entendido</button>`);return}
  try{const ok=await AB.pay.buy();if(ok){await AB.vip.activate(U);privTab='planes';toast('¡Bienvenida a ALETSE FIT VIP!')}}catch(x){toast(x.userMessage||'No se pudo completar el pago')}}
async function doRestore(){const ok=await AB.pay.restore();if(ok){await AB.vip.activate(U);toast('Compra restaurada')}else toast('No hay ninguna suscripción activa')}
function forgot(){openModal(`<h2 style="margin-bottom:10px">Recuperar contraseña</h2><p class="mute" style="margin:0 0 6px">Te enviaremos un correo para crear una nueva.</p><form id="fForm"><label for="fMail">Correo electrónico</label><input id="fMail" type="email" required><p class="err" id="fErr"></p><button class="btn primary block" type="submit">Enviar correo</button></form><button class="btn ghost block" data-m="no" style="margin-top:10px">Cancelar</button>`)}
function delAcc(){openModal(`<h2 style="margin-bottom:10px">Borrar mi cuenta</h2><p class="mute" style="margin:0 0 6px">Se borrarán para siempre tu cuenta, tu progreso, tus planes y tus mensajes. Si tienes la suscripción VIP, cancélala también en la tienda para que no se cobre más.</p><form id="dForm"><label for="dPass">Escribe tu contraseña para confirmar</label><input id="dPass" type="password" required><p class="err" id="dErr"></p><button class="btn dark block" type="submit">Borrar definitivamente</button></form><button class="btn ghost block" data-m="no" style="margin-top:10px">Cancelar</button>`)}
sheet.addEventListener('submit',async e=>{e.preventDefault();
  if(e.target.id==='fForm'){const m=document.getElementById('fMail').value.trim();try{await AB.resetPassword(m);closeModal();toast('Te hemos enviado un correo')}catch(x){document.getElementById('fErr').textContent=x.userMessage||'No se pudo enviar'}}
  if(e.target.id==='dForm'){try{await AB.deleteAccount(document.getElementById('dPass').value);closeModal();toast('Cuenta borrada')}catch(x){document.getElementById('dErr').textContent=x.userMessage||'No se pudo borrar'}}});
AB.start((user,data)=>{booting=false;if(vipStop){vipStop();vipStop=null}
  U=user;S=user?Object.assign(blank(),data||{}):null;
  if(U){vipStop=AB.vip.watch(p=>{if(!S)return;const was=!!S.premium;S.premium=p;const typing=document.activeElement&&/^(cIn|qInj|qFood|qGoal|qAge|qH|qW|qDays)$/.test(document.activeElement.id);if(!typing||was!==!!p)render();else{const ch=document.getElementById('chat');if(ch&&sub==='privado'){render()}}});syncVip()}
  render()});
render();
try{const SB=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.StatusBar;if(SB){SB.setStyle({style:'DARK'});SB.setBackgroundColor&&SB.setBackgroundColor({color:'#070707'})}}catch(_){}
}
</script>
