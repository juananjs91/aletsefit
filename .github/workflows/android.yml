# Compila la app de Android (.aab) lista para subir a Google Play.
# Se lanza desde GitHub › Actions › "Crear app Android" › Run workflow (se puede hacer desde el móvil).
name: Crear app Android
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión visible (por ejemplo 1.0.0)"
        required: true
        default: "1.0.0"
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Preparar clave de firma
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/upload.jks
      - name: Compilar .aab firmado
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: chmod +x gradlew && ./gradlew bundleRelease assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aletsefit-android-${{ inputs.version }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
