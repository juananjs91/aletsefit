# Publica la web (política de privacidad, borrar cuenta y panel de administración) en GitHub Pages.
# Se lanza sola cada vez que cambias algo en docs/ o en www/config.js.
name: Publicar web
on:
  push:
    branches: [main]
    paths: ["docs/**", "www/config.js", "src/**"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build && cp www/config.js docs/config.js && rm -rf docs/app && cp -r www docs/app
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: d
        uses: actions/deploy-pages@v4
